  <style>
    body {
      font-family: 'Montserrat', sans-serif;
      background: linear-gradient(180deg, #98D0B3 0%, #F2E6CF 100%);
      color: #2F4F4F;
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
    }
    .checkout-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 18px;
    }
    .checkout-card {
      background: rgba(255, 255, 255, 0.62);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 24px;
      padding: 32px 24px;
      border: 1px solid rgba(255, 255, 255, 0.6);

      width: 100%;
    }
    @media (min-width: 540px){
      .checkout-card { padding: 44px 40px; }
    }
    .checkout-eyebrow {
      font-size: .7rem;
      font-weight: 800;

      text-transform: uppercase;

    .checkout-title {
      font-family: 'Dancing Script', cursive !important;

    .checkout-form input {
      padding: 14px 16px;

<body>
  <noscript><iframe loading="lazy" src="https://www.googletagmanager.com/ns.html?id=GTM-5RW8LB7B" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

  <!-- ============================================
       PAGE DE CHECKOUT — formulaire pré-Mollie
       Capture nom + email + téléphone côté SVB
       puis redirige vers le Mollie Payment Link adapté.
       Param URL : ?offre=reformer | coaching | pass-starter
       ============================================ -->

  <main class="checkout-wrap" id="main-content">
    <div class="checkout-card">

      <p class="checkout-eyebrow" id="offre-eyebrow">Studio SVB · Saint-Ouen</p>
      <h1 class="checkout-title" id="offre-title">Réserver mon essai</h1>

      <div class="checkout-price" id="offre-price">—</div>
      <p class="checkout-price-note" id="offre-note">Paiement sécurisé Apple&nbsp;Pay · Google&nbsp;Pay · CB</p>

      <!-- Le formulaire est détecté par Netlify (data-netlify=true) côté build.
           Une copie statique du formulaire avec ses champs est requise pour
           que le bot Netlify l'enregistre. -->
      <form
        id="checkoutForm"
        class="checkout-form"
        name="reservation-paiement"
        method="POST"
        data-netlify="true"
        data-netlify-honeypot="website-url"
        action="/merci-essai"
      >
        <input type="hidden" name="form-name" value="reservation-paiement" />
        <input type="hidden" name="offre" id="offreInput" value="" />
        <input type="hidden" name="prix"  id="prixInput"  value="" />

        <p class="hp">
          <label>Ne pas remplir: <input name="website-url" autocomplete="off" tabindex="-1" /></label>
        </p>

        <label>Prénom
          <input required name="firstname" autocomplete="given-name" type="text" maxlength="40" placeholder="Prénom" />
        </label>
        <label>Email
          <input required type="email" name="email" autocomplete="email" placeholder="ton@email.fr" />
        </label>
        <label>Téléphone
          <input required type="tel" name="phone" autocomplete="tel" pattern="[0-9\s\+\-\.\(\)]{8,}" placeholder="06 12 34 56 78" />
        </label>

        <button type="submit" class="checkout-submit" id="submitBtn">
          Continuer vers le paiement →
        </button>

        <div id="errorBox" class="checkout-error" hidden></div>
      </form>

      <p class="checkout-trust">
        <strong>2 étapes chrono</strong> : tes infos puis paiement.<br>
        L'équipe SVB te recontacte sous <strong>24 h</strong> pour caler ton créneau.
      </p>

      <p class="checkout-back">
        <a href="/">← Retour à l'accueil</a>
      </p>
    </div>
  </main>

  <script>
    // Mapping offre → titre / prix / lien Mollie
    var OFFRES = {
      'reformer': {
        title:   'Séance d\'essai Reformer · Crossformer',
        price:   '30 €',
        priceNum: 30,
        eyebrow: 'Cours des Lavandières · Saint-Ouen',
        mollie:  'https://payment-links.mollie.com/payment/HHhAgySncFYsyz84i6ytA'
      },
      'coaching': {
        title:   'Séance d\'essai Coaching · Small Group',
        price:   '15 €',
        priceNum: 15,
        eyebrow: 'Mail André Breton · Saint-Ouen',
        mollie:  'https://payment-links.mollie.com/payment/UfNLNU8M2tNkHBhrV53yq'
      },
      'pass-starter': {
        title:   'Pass Starter · 5 séances',
        price:   '99,90 €',
        priceNum: 99.90,
        eyebrow: 'Sans engagement · 1 mois',
        mollie:  'https://payment-links.mollie.com/payment/ciK265VBM3SHV2AnZhhU2'
      }
    };

    (function(){
      // Lecture du paramètre URL ?offre=
      var params = new URLSearchParams(window.location.search);
      var offreKey = (params.get('offre') || 'reformer').toLowerCase();
      var offre = OFFRES[offreKey] || OFFRES['reformer'];

      // Population dynamique de la card
      document.getElementById('offre-eyebrow').textContent = offre.eyebrow;
      document.getElementById('offre-title').textContent   = offre.title;
      document.getElementById('offre-price').textContent   = offre.price;
      document.getElementById('offreInput').value          = offreKey;
      document.getElementById('prixInput').value           = offre.price;
      document.title = 'Réserver · ' + offre.title + ' · Studio SVB';

      // Soumission AJAX → Netlify Form → redirect Mollie
      var form = document.getElementById('checkoutForm');
      var btn  = document.getElementById('submitBtn');
      var errBox = document.getElementById('errorBox');

      form.addEventListener('submit', function(e){
        e.preventDefault();
        errBox.hidden = true;
        var data = new FormData(form);
        if (data.get('website-url')) { return; /* honeypot — silent drop */ }

        btn.disabled = true;
        btn.textContent = 'Envoi…';

        // Tracking GA4 — démarrage paiement
        if (window.gtag) {
          gtag('event', 'begin_checkout', {
            value: offre.priceNum,
            currency: 'EUR',
            items: [{ item_id: offreKey, item_name: offre.title, price: offre.priceNum, quantity: 1 }]
          });
        }

        fetch('/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams(data).toString()
        })
        .then(function(res){
          if (!res.ok) throw new Error('Submission failed: ' + res.status);
          // Form soumis → redirige vers Mollie
          btn.textContent = 'Redirection vers le paiement…';
          window.location.href = offre.mollie;
        })
        .catch(function(err){
          console.error('[checkout] form error', err);
          btn.disabled = false;
          btn.textContent = 'Réessayer →';
          errBox.hidden = false;
          errBox.textContent = 'Une erreur réseau est survenue. Réessaye, ou contacte-nous au 07 44 91 91 55.';
        });
      });
    })();
  </script>
</body>
