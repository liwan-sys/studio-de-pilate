# ================================================================
# Studio SVB · Configuration Netlify
# Build, headers, redirects, edge functions, forms
# ================================================================

[build]
  publish = "dist"
  command = "./build.sh"
  functions = "netlify/functions"
  edge_functions = "netlify/edge-functions"
  environment = { TAILWIND_VERSION = "v3.4.17" }

# ---- Plugins Netlify ----
# Contrôle Lighthouse à chaque déploiement.

[[plugins]]
  package = "@netlify/plugin-lighthouse"

  [plugins.inputs.thresholds]
    performance   = 0.85
    accessibility = 0.90
    best-practices = 0.90
    seo           = 0.95
    pwa           = 0.75

  [plugins.inputs.audits]
    output_path = "reports/lighthouse.html"

# ---- Analytics first-party ----
[[edge_functions]]
  path = "/api/track"
  function = "track"

# ---- Forms Netlify ----
# Detection automatique dans le HTML via attribute data-netlify="true"
# (voir contact.html)

# ---- Security & performance headers (rappel, _headers file a priorité) ----

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

# ---- Environment ----
# Les variables secrètes des formulaires et paiements restent configurées
# directement dans l'interface Netlify.
