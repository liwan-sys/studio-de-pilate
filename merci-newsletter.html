  <style>
    body{
      margin:0;min-height:100svh;
      background:linear-gradient(165deg,#98D0B3 0%,#F2E6CF 50%,#E8B496 100%);
      display:flex;align-items:center;justify-content:center;padding:24px;
      font-family:'Montserrat',sans-serif;color:#2F4F4F;
    }
    .card{
      background:rgba(255,255,255,.92);backdrop-filter:blur(24px);
      border-radius:32px;padding:48px 36px;max-width:520px;width:100%;text-align:center;
      box-shadow:0 30px 70px rgba(47,79,79,.18);border:1px solid rgba(255,255,255,.9);
    }
    .emoji{font-size:4rem;line-height:1;margin-bottom:12px}
    h1{font-family:'Great Vibes',cursive;font-weight:400;font-size:3.8rem;line-height:1;color:#4A8D84;margin:0 0 12px}
    .sub{font-family:'Dancing Script',cursive;font-weight:600;font-size:1.5rem;color:#2F4F4F;margin:0 0 1.4rem}
    p{line-height:1.7;opacity:.78;margin:0 0 1.6rem}
    .btn{
      display:inline-block;padding:14px 30px;border-radius:999px;
      background:#2F4F4F;color:#FBF6EC;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.85rem;
      text-decoration:none;transition:all .25s;
    }
    .btn:hover{background:#4A8D84;transform:translateY(-2px)}
  </style>
